# HEXOD — nginx site (same VPS as PaintIt, separate app)
# Target: /etc/nginx/sites-available/hexod  →  ln -s to sites-enabled/
# Replace hexod.example.com with your domain everywhere (sed -i 's/hexod.example.com/MONDOMAINE/g').
# gunicorn/uvicorn listens on 127.0.0.1:8002 (PaintIt uses 8000, 8001 is taken by another app on this VPS).

upstream hexod_app {
    server 127.0.0.1:8002 fail_timeout=0;
}

map $http_upgrade $hexod_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hexod.example.com www.hexod.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://hexod.example.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hexod.example.com;
    ssl_certificate     /etc/letsencrypt/live/hexod.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexod.example.com/privkey.pem;
    return 301 https://hexod.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hexod.example.com;

    ssl_certificate     /etc/letsencrypt/live/hexod.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexod.example.com/privkey.pem;

    client_max_body_size 10m;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vite build (hashed files → cache forever)
    location /assets/ {
        alias /home/hexod/terra-domini/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Django static (admin, DRF) — collectstatic
    location /static/ {
        alias /home/hexod/terra-domini/backend/staticfiles/;
        access_log off;
        expires 30d;
    }
    location /media/ {
        alias /home/hexod/data/media/;
        expires 7d;
    }
    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://hexod_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hexod_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    # API + SPA (Django serves index.html)
    location / {
        proxy_pass http://hexod_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
